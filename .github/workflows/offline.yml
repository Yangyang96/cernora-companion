name: offline-quality-gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frozen-evidence:
    name: CPython ${{ matrix.python-version }} offline evidence
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.2"
          enable-cache: false
      - name: Acquire pinned dependencies
        run: uv sync --frozen --all-groups
      - name: Verify public Cernora wheel isolation
        run: uv run python scripts/verify_public_wheel.py --python ${{ matrix.python-version }}
      - name: Run complete offline private publication gate
        run: uv run python scripts/verify_release.py
