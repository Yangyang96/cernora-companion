name: offline-quality-gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frozen-evidence:
    name: CPython ${{ matrix.python-version }} offline evidence
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: companion
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: companion
          persist-credentials: false
      - name: Check out the accepted Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Yangyang96/cernora
          ref: 7b46258457142cfd32bc8c7ea46bc21740b475de
          path: cernora
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.2"
          enable-cache: false
      - name: Build and verify the accepted Core wheel
        working-directory: cernora
        run: |
          uv build --wheel --out-dir dist
          echo "4ef10a5eb2f9961943883576ab81bc97ce32d2f3f8a88cb9679d5c51c81e368d  dist/cernora-0.1.4-py3-none-any.whl" | sha256sum --check --strict
      - name: Acquire pinned dependencies
        run: uv sync --frozen --all-groups
      - name: Prepare isolated wheel verification
        run: |
          uv build --wheel --offline --out-dir dist
          uv venv --seed --python ${{ matrix.python-version }} "${RUNNER_TEMP}/wheel-seed"
      - name: Verify accepted wheels offline
        run: >-
          uv run python scripts/verify_comparison_wheels.py
          --core-wheel ../cernora/dist/cernora-0.1.4-py3-none-any.whl
          --companion-wheel dist/cernora_reference_workflow-0.4.2-py3-none-any.whl
          --python ${{ matrix.python-version }}
      - name: Run complete offline private publication gate
        run: uv run python scripts/verify_release.py
