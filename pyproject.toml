[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cernora-reference-workflow"
version = "0.4.1"
description = "Pinned local reference workflow for Cernora coding-agent evidence"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Cernora contributors" }]
dependencies = [
  "cernora==0.1.4",
  "jsonschema==4.25.1",
  "pydantic==2.11.7",
]

[project.scripts]
experiment = "cernora_reference_workflow.cli:main"

[project.optional-dependencies]
live = ["harbor==0.16.1"]

[dependency-groups]
dev = [
  "build==1.3.0",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.10",
]
live = ["harbor==0.16.1"]
[tool.hatch.build.targets.wheel]
packages = ["src/cernora_reference_workflow"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: deterministic unit test",
  "conformance: public-boundary conformance test",
  "adversarial: malformed or hostile input test",
]
filterwarnings = [
  "ignore:Using extra keyword arguments on `Field` is deprecated.*:pydantic.PydanticDeprecatedSince20",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "harbor.*"
ignore_missing_imports = true
